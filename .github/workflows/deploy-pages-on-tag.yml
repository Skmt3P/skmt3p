name: Deploy Portfolio on semantic release tag

on:
  push:
    tags: ['portfolio/[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require a semantic version tag on master
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^portfolio/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master
          test -s docs/index.html
          test "$(cat docs/CNAME)" = 'skmt3p.com'
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.source_sha != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Portfolio artifact
        id: deployment
        uses: actions/deploy-pages@v4
